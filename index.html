<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Destructovibe</title>
    <meta name="description" content="First-person structural demolition. Take the contract, bring it all down." />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0e0e0d" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3Cpattern id='h' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'%3E%3Crect width='4' height='8' fill='%23ffc400'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width='32' height='32' rx='5' fill='%230e0e0d'/%3E%3Crect x='3' y='21' width='26' height='8' rx='1' fill='url(%23h)'/%3E%3Cpath d='M7 18V4h7.5a7 7 0 0 1 0 14z' fill='%23eceae3'/%3E%3Cpath d='M11 8v6h3a3 3 0 0 0 0-6z' fill='%230e0e0d'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap"
    />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&display=swap" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0e0e0d;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-content: center;
        gap: 18px;
        background: radial-gradient(120% 90% at 50% 38%, #1f2022 0%, #121312 62%, #0a0a0a 100%);
        color: #eceae3;
        font: 400 clamp(28px, 5vw, 64px) / 1 'Saira Stencil One', 'Barlow Condensed', Impact, sans-serif;
        letter-spacing: 0.01em;
        text-align: center;
      }
      #boot em {
        font-style: normal;
        color: #ffc400;
      }
      #boot i {
        display: block;
        justify-self: center;
        width: min(360px, 70vw);
        height: 6px;
        background: repeating-linear-gradient(-45deg, #ffc400 0 9px, #0e0e0d 9px 18px);
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div id="viewport"></div>
    <div id="ui"></div>
    <div id="boot" aria-hidden="true">DESTRUCTO<em>VIBE</em><i></i></div>
    <noscript
      ><p style="position: fixed; inset: 0; display: grid; place-content: center; margin: 0; color: #eceae3; font: 16px sans-serif">
        Destructovibe needs JavaScript and WebGL.
      </p></noscript
    >
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
